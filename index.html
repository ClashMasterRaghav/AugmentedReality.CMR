<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vision Pro AR Experience</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            padding: 10px;
            color: #fff;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            z-index: 100;
            pointer-events: none;
        }

        #info a {
            color: #4af;
            pointer-events: auto;
        }

        #loadingMessage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px 30px;
            border-radius: 10px;
            z-index: 200;
        }

        #notificationContainer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 300px;
            z-index: 300;
            pointer-events: none;
        }

        .notification {
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            margin-bottom: 10px;
            padding: 10px 15px;
            border-radius: 8px;
            text-align: center;
            animation: fadeInOut 2s ease-in-out forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(20px); }
            10% { opacity: 1; transform: translateY(0); }
            90% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }

        #errorMessage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            background-color: rgba(255, 0, 0, 0.7);
            padding: 20px 30px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 300;
        }

        video {
            display: none;
        }
    </style>
</head>
<body>
    <div id="info">
        <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a>
        Vision Pro AR Experience
    </div>

    <div id="loadingMessage">Loading AR Experience...</div>
    <div id="notificationContainer"></div>
    <div id="errorMessage"></div>

    <!-- Video element used for texture -->
    <video id="videoElement" loop crossorigin="anonymous" playsInline>
        <source src="examples/textures/ar_videos/ar_Tek_It.mp4" type="video/mp4">
        <source src="examples/textures/sintel.mp4" type="video/mp4">
    </video>

    <!-- Initial interaction helper for mobile -->
    <div id="interactionHelper" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background-color: rgba(0,0,0,0.8); z-index: 1000; color: white; text-align: center; padding-top: 40%;">
        <h2>Tap to Start</h2>
        <p>Tap anywhere to begin your AR experience</p>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "./build/three.module.js",
                "three/addons/": "./examples/jsm/"
            }
        }
    </script>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
