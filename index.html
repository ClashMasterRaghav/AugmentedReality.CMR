<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Web Screens</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            touch-action: none;
        }
        
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }
        
        #ui-container > * {
            pointer-events: auto;
        }
        
        #ar-status {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            z-index: 1001;
        }
        
        .status-checking {
            background-color: rgba(0, 0, 0, 0.6);
            color: #fff;
        }
        
        .status-ready {
            background-color: rgba(0, 128, 0, 0.6);
            color: #fff;
        }
        
        .status-error {
            background-color: rgba(255, 0, 0, 0.6);
            color: #fff;
        }
        
        #notification-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 1002;
        }
        
        .notification {
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            max-width: 300px;
            text-align: center;
            animation: fadeInOut 3s ease-in-out;
            opacity: 0;
        }
        
        .notification.success {
            background-color: rgba(0, 128, 0, 0.7);
            color: #fff;
        }
        
        .notification.warning {
            background-color: rgba(255, 166, 0, 0.7);
            color: #fff;
        }
        
        .notification.error {
            background-color: rgba(255, 0, 0, 0.7);
            color: #fff;
        }
        
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(20px); }
            10% { opacity: 1; transform: translateY(0); }
            90% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }
        
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 0.5s ease-in-out;
        }
        
        #loading-screen h1 {
            margin-bottom: 20px;
            font-size: 28px;
            color: #fff;
        }
        
        #loading-bar-container {
            width: 300px;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            overflow: hidden;
        }
        
        #loading-bar {
            height: 100%;
            width: 0%;
            background-color: #4fc3f7;
            transition: width 0.3s ease;
        }
        
        #loading-text {
            margin-top: 10px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        #version-info {
            position: absolute;
            bottom: 5px;
            right: 5px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <h1>AR Web Screens</h1>
        <div id="loading-bar-container">
            <div id="loading-bar"></div>
        </div>
        <div id="loading-text">Loading...</div>
        <div id="version-info">v1.0.0</div>
    </div>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/",
            "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/"
        }
    }
    </script>
    
    <script type="module" src="src/app.js"></script>
    
    <script>
        // Loading screen handler
        let loadingProgress = 0;
        const loadingBar = document.getElementById('loading-bar');
        const loadingText = document.getElementById('loading-text');
        const loadingScreen = document.getElementById('loading-screen');
        
        // Simulate loading progress
        const loadingInterval = setInterval(() => {
            if (loadingProgress < 90) {
                loadingProgress += Math.random() * 10;
                loadingProgress = Math.min(loadingProgress, 90);
                updateLoadingBar();
            }
        }, 200);
        
        // Update loading bar
        function updateLoadingBar() {
            loadingBar.style.width = `${loadingProgress}%`;
            loadingText.textContent = `Loading... ${Math.round(loadingProgress)}%`;
        }
        
        // Hide loading screen when application is ready
        window.addEventListener('DOMContentLoaded', () => {
            document.addEventListener('ar-initialized', () => {
                // Complete loading bar
                loadingProgress = 100;
                updateLoadingBar();
                
                // Hide loading screen
                setTimeout(() => {
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                    }, 500);
                    
                    clearInterval(loadingInterval);
                }, 500);
            });
            
            // Fallback to ensure loading screen eventually disappears
            setTimeout(() => {
                if (loadingProgress < 100) {
                    loadingProgress = 100;
                    updateLoadingBar();
                    
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                    }, 500);
                    
                    clearInterval(loadingInterval);
                }
            }, 8000);
        });
    </script>
</body>
</html>
