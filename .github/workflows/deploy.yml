name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: './react-ar-app/package-lock.json'

      - name: 📥 Install Dependencies
        run: |
          cd react-ar-app
          # Use npm install with legacy-peer-deps to resolve conflicts
          npm install --legacy-peer-deps
          # Install specific compatible versions
          npm install three@0.160.0 @react-three/fiber@8.15.11 @react-three/drei@9.90.0 @react-three/xr@5.7.1 --save --legacy-peer-deps

      - name: 🛠️ Build React App
        run: |
          cd react-ar-app
          # Fix permissions or use npx
          chmod +x node_modules/.bin/react-scripts
          # Run build with npx as a fallback if chmod doesn't work
          npm run build || npx react-scripts build
        env:
          CI: false

      - name: 📄 Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './react-ar-app/build'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
