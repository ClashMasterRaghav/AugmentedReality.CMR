name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    # Use container to avoid permission issues and ensure consistent environment
    container:
      image: node:18

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Setup and Build
        run: |
          cd react-ar-app
          echo "Installing dependencies with fallback options..."
          npm install --no-fund --no-audit --legacy-peer-deps || npm install --force
          
          echo "Installing specific Three.js compatibility packages..."
          npm install three@0.160.0 @react-three/fiber@8.15.11 @react-three/drei@9.90.0 @react-three/xr@5.7.1 --save --legacy-peer-deps
          
          echo "Setting permissions for build scripts..."
          chmod -R 755 node_modules/.bin
          
          echo "Building application..."
          export NODE_OPTIONS=--max_old_space_size=4096
          npm run build || npx react-scripts build || NODE_ENV=production npx react-scripts build
        env:
          CI: false

      - name: 📄 Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './react-ar-app/build'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
