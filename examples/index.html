<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>WebXR Interactive Web Content Demo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            padding: 10px;
            color: white;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 100;
        }
        
        #startButton {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 12px 24px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        
        #startButton:hover {
            background-color: #3367d6;
        }
        
        #noXRMessage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            padding: 20px;
            background-color: #f44336;
            color: white;
            text-align: center;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            display: none;
            z-index: 100;
        }
        
        #loadingIndicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 8px solid #3498db;
            border-top: 8px solid #f3f3f3;
            animation: spin 1s linear infinite;
            display: none;
            z-index: 100;
        }

        #errorDisplay {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background-color: rgba(255, 0, 0, 0.7);
            color: white;
            font-family: monospace;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            max-width: 90%;
            max-height: 150px;
            overflow: auto;
            z-index: 1000;
        }
        
        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="info">
        WebXR Interactive Web Content Demo
        <br>
        <small>Select a demo method from the control panel to test different web content approaches.</small>
    </div>
    
    <button id="startButton">Start AR Experience</button>
    
    <div id="noXRMessage">
        <h3>WebXR Not Available</h3>
        <p>Your browser does not support WebXR or it is not enabled.</p>
        <p>Please try using a compatible browser or device.</p>
    </div>
    
    <div id="loadingIndicator"></div>
    <div id="errorDisplay" style="display: none;"></div>
    
    <!-- Load Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "../build/three.module.js",
            "three/addons/": "./jsm/"
        }
    }
    </script>
    
    <!-- Main application -->
    <script type="module">
        // Add a cache busting random value to prevent browser caching
        const cacheBuster = Math.random().toString(36).substring(2, 15) + Date.now();
        
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';
        
        // Make these globally available for our demos
        window.THREE = THREE;
        window.CSS3DRenderer = CSS3DRenderer;
        window.CSS3DObject = CSS3DObject;
        
        // Set up error tracking
        window.addEventListener('error', function(event) {
            const errorDisplay = document.getElementById('errorDisplay');
            if (errorDisplay) {
                errorDisplay.style.display = 'block';
                errorDisplay.innerHTML += `<div>${event.message} at ${event.filename}:${event.lineno}</div>`;
                console.error("Caught error:", event);
            }
        });
        
        // Import our application modules with aggressive cache busting
        import { checkXRSupport } from `./ar_core.js?v=${cacheBuster}`;
        import { initAR, startAR, updateAR, scene, camera, renderer } from `./ar_core.js?v=${cacheBuster}`;
        
        // Initialize the application
        document.addEventListener('DOMContentLoaded', () => {
            const startButton = document.getElementById('startButton');
            const noXRMessage = document.getElementById('noXRMessage');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const infoElement = document.getElementById('info');
            
            // Check if WebXR is supported
            checkXRSupport().then(supported => {
                if (supported) {
                    // WebXR is supported
                    startButton.addEventListener('click', () => {
                        startButton.style.display = 'none';
                        loadingIndicator.style.display = 'block';
                        
                        // Set global scene reference for modules that need it
                        window.startARApp = function() {
                            // Load the demo module dynamically with aggressive cache busting
                            import(`./ar_main.js?v=${cacheBuster}`).then(module => {
                                // Module loaded, the init function will be called automatically
                                loadingIndicator.style.display = 'none';
                                setTimeout(() => {
                                    infoElement.style.display = 'none';
                                }, 5000);
                            }).catch(error => {
                                console.error('Failed to load AR module:', error);
                                loadingIndicator.style.display = 'none';
                                displayError('Failed to load AR module. Please try again. Error: ' + error.message);
                            });
                        };
                        
                        // Start with a slight delay to ensure DOM is ready
                        setTimeout(window.startARApp, 100);
                    });
                } else {
                    // WebXR is not supported
                    startButton.style.display = 'none';
                    noXRMessage.style.display = 'block';
                }
            });
        });
        
        // Display error message
        function displayError(message) {
            const errorElement = document.createElement('div');
            errorElement.style.position = 'absolute';
            errorElement.style.top = '50%';
            errorElement.style.left = '50%';
            errorElement.style.transform = 'translate(-50%, -50%)';
            errorElement.style.padding = '20px';
            errorElement.style.backgroundColor = 'rgba(255, 0, 0, 0.8)';
            errorElement.style.color = 'white';
            errorElement.style.borderRadius = '5px';
            errorElement.style.zIndex = '1000';
            errorElement.textContent = message;
            document.body.appendChild(errorElement);
            
            setTimeout(() => {
                document.body.removeChild(errorElement);
                document.getElementById('startButton').style.display = 'block';
            }, 5000);
        }
    </script>
</body>
</html>
